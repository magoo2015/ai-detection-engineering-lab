- id: DET-SSH-002-S09
  detector_id: DET-SSH-002
  description: Successful authentication occurs before the failed authentications from the same source IP for the same username.
  ground_truth: benign
  scope: in_scope
  expected_alert: false
  notes: 'Invalid sequence for this hypothesis: the success at 10:00 precedes the failures at 10:01-10:03,
    so the failures cannot have led to the access. Confirms ordering is enforced, not just co-occurrence.'

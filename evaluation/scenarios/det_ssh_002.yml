- id: DET-SSH-002-S01
  detector_id: DET-SSH-002
  description: Three failed password authentications followed by a success from the same source IP for the same username within 10 minutes.
  ground_truth: malicious
  scope: in_scope
  expected_alert: true
  notes: 'Baseline true positive at the exact correlation threshold: 3 same-IP, same-user failures
    precede a success 3 minutes after the first failure, inside the 10-minute window.'
  events:
  - timestamp: '2026-08-25T10:00:00Z'
    auth_result: failure
    source_ip: 203.0.113.60
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:01:00Z'
    auth_result: failure
    source_ip: 203.0.113.60
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:02:00Z'
    auth_result: failure
    source_ip: 203.0.113.60
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:03:00Z'
    auth_result: success
    source_ip: 203.0.113.60
    username: admin
    auth_method: password

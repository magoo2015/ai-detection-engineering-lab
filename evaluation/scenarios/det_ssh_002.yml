  - timestamp: '2026-08-25T09:01:10Z'
    auth_result: success
    source_ip: 198.51.100.15
    username: alice
    auth_method: password
- id: DET-SSH-002-S06
  detector_id: DET-SSH-002
  description: Failures against one username followed by a success for a different username from the same source IP.
  ground_truth: benign
  scope: in_scope
  expected_alert: false
  notes: 'Identity-correlation protection: failures for admin and a success for deploy do not share a
    username, so the failure-then-success hypothesis is not met for any single account.'
  events:
  - timestamp: '2026-08-25T10:00:00Z'
    auth_result: failure
    source_ip: 198.51.100.20
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:01:00Z'
    auth_result: failure
    source_ip: 198.51.100.20
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:02:00Z'
    auth_result: failure
    source_ip: 198.51.100.20
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:03:00Z'
    auth_result: success
    source_ip: 198.51.100.20
    username: deploy
    auth_method: password

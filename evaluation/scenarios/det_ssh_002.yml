- id: DET-SSH-002-S10
  detector_id: DET-SSH-002
  description: Three failed password authentications followed by a successful public-key authentication from the same source IP for the same username.
  ground_truth: benign
  scope: in_scope
  expected_alert: true
  notes: 'Authentication-method challenge: a user fails password auth three times, then falls back to
    their SSH key and succeeds. Public-key success does not indicate a guessed password, so this is
    benign. DET-SSH-002 does not consider auth_method, so it is expected to alert. This scenario evaluates
    whether correlation across authentication methods creates analyst noise.'
  events:
  - timestamp: '2026-08-25T10:00:00Z'
    auth_result: failure
    source_ip: 198.51.100.35
    username: sysadmin
    auth_method: password
  - timestamp: '2026-08-25T10:00:30Z'
    auth_result: failure
    source_ip: 198.51.100.35
    username: sysadmin
    auth_method: password
  - timestamp: '2026-08-25T10:01:00Z'
    auth_result: failure
    source_ip: 198.51.100.35
    username: sysadmin
    auth_method: password
  - timestamp: '2026-08-25T10:01:30Z'
    auth_result: success
    source_ip: 198.51.100.35
    username: sysadmin
    auth_method: publickey

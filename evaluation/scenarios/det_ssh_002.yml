- id: DET-SSH-002-S08
  detector_id: DET-SSH-002
  description: Failure-then-success sequences where username evidence is unavailable on either the failures or the success.
  ground_truth: benign
  scope: in_scope
  expected_alert: false
  notes: 'Insufficient correlation evidence: on 203.0.113.65 the failures have no username before a success
    for admin; on 203.0.113.66 the failures are for admin but the success has no username. An unknown
    username must never be treated as the same username, so neither sequence may correlate.'
  events:

    username: null
    auth_method: password
  - timestamp: '2026-08-25T10:03:00Z'
    auth_result: success
    source_ip: 203.0.113.65
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:00:00Z'
    auth_result: failure
    source_ip: 203.0.113.66
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:01:00Z'
    auth_result: failure
    source_ip: 203.0.113.66

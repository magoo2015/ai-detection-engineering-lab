- id: DET-SSH-002-S03
  detector_id: DET-SSH-002
  description: Two failed password authentications followed by a successful credential guess from the same source IP for the same username.
  ground_truth: malicious
  scope: in_scope
  expected_alert: false
  notes: 'Intended false negative caused by threshold: the attacker guesses the password on the third
    attempt, leaving only 2 prior failures, one below the configured failure threshold of 3.'
  events:
  - timestamp: '2026-08-25T10:00:00Z'
    auth_result: failure
    source_ip: 203.0.113.62
    username: ubuntu
    auth_method: password
  - timestamp: '2026-08-25T10:01:00Z'
    auth_result: failure
    source_ip: 203.0.113.62
    username: ubuntu
    auth_method: password
  - timestamp: '2026-08-25T10:02:00Z'
    auth_result: success
    source_ip: 203.0.113.62
    username: ubuntu
    auth_method: password
- id: DET-SSH-002-S04
  detector_id: DET-SSH-002
  description: Three failed password authentications followed by a success outside the 10-minute correlation window.
  ground_truth: malicious
  scope: in_scope
  expected_alert: false
  notes: 'Intended false negative caused by correlation window: failures at 10:00-10:02 and the success
    at 10:20 are 18-20 minutes apart, so no failure falls within the 10-minute window. Models a patient
    attacker who pauses before using guessed credentials.'
  events:
  - timestamp: '2026-08-25T10:00:00Z'
    auth_result: failure
    source_ip: 203.0.113.63
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:01:00Z'
    auth_result: failure
    source_ip: 203.0.113.63
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:02:00Z'
    auth_result: failure
    source_ip: 203.0.113.63
    username: admin
    auth_method: password
  - timestamp: '2026-08-25T10:20:00Z'
    auth_result: success
    source_ip: 203.0.113.63
    username: admin
    auth_method: password
